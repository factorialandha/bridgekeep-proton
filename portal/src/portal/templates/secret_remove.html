{% extends "base.html" %}
{% block title %}{{ what }}{% endblock %}
{% block main %}
<h1>{{ what }}</h1>
<p>{{ detail }} The host applies it within 5 minutes, and tells your Discord channel first.</p>
<form method="post" action="/secrets/remove" class="inline">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="confirm" value="yes">
  <input type="hidden" name="name" value="{{ secret }}">
  <button class="primary">{{ button }}</button>
</form>
<a href="{{ back }}" class="spaced">Cancel</a>
{% endblock %}
