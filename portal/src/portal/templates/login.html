{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block gate %}
<h1>Sign in</h1>
{% include "_error.html" %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  {% if totp_on %}
  <label for="code">Code from your authenticator</label>
  <input id="code" name="code" class="mono" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required>
  {% endif %}
  <button class="primary">Sign in</button>
</form>
<p class="hint">Locked out? On the host, run <code>./bridgekeep portal reset-admin</code>.</p>
{% endblock %}
